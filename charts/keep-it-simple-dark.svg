<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Keep it simple">
<rect width="900" height="500" fill="#1a1a19"/>
<text x="40" y="46" font-size="23" font-weight="700" fill="#ffffff">Keep it simple</text>
<text x="40" y="72" font-size="14.5" fill="#c3c2b7">Vendor questionnaire length against the share of vendors who actually answer it.</text>
<line x1="70" y1="360.0" x2="700" y2="360.0" stroke="#33322f" stroke-width="1"/><text x="58" y="364.0" font-size="12" fill="#94938b" text-anchor="end">0%</text><line x1="70" y1="305.0" x2="700" y2="305.0" stroke="#33322f" stroke-width="1"/><text x="58" y="309.0" font-size="12" fill="#94938b" text-anchor="end">25%</text><line x1="70" y1="250.0" x2="700" y2="250.0" stroke="#33322f" stroke-width="1"/><text x="58" y="254.0" font-size="12" fill="#94938b" text-anchor="end">50%</text><line x1="70" y1="195.0" x2="700" y2="195.0" stroke="#33322f" stroke-width="1"/><text x="58" y="199.0" font-size="12" fill="#94938b" text-anchor="end">75%</text><line x1="70" y1="140.0" x2="700" y2="140.0" stroke="#33322f" stroke-width="1"/><text x="58" y="144.0" font-size="12" fill="#94938b" text-anchor="end">100%</text><text x="70.0" y="384" font-size="12" fill="#94938b" text-anchor="middle">5</text><text x="239.0" y="384" font-size="12" fill="#94938b" text-anchor="middle">15</text><text x="345.7" y="384" font-size="12" fill="#94938b" text-anchor="middle">30</text><text x="452.4" y="384" font-size="12" fill="#94938b" text-anchor="middle">60</text><text x="559.0" y="384" font-size="12" fill="#94938b" text-anchor="middle">120</text><text x="700.0" y="384" font-size="12" fill="#94938b" text-anchor="middle">300</text><text x="385" y="410" font-size="12.5" fill="#c3c2b7" text-anchor="middle">Questions in the questionnaire</text><path d="M 70.0 157.6 L 239.0 175.2 L 345.7 203.8 L 452.4 263.2 L 559.0 318.2 L 700.0 346.8" fill="none" stroke="#3987e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70.0" cy="157.6" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="239.0" cy="175.2" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="345.7" cy="203.8" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="452.4" cy="263.2" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="559.0" cy="318.2" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="700.0" cy="346.8" r="4.5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><circle cx="345.7" cy="203.8" r="9" fill="none" stroke="#d95926" stroke-width="2"/><line x1="345.7" y1="189.8" x2="345.7" y2="124" stroke="#d95926" stroke-width="1.5" stroke-dasharray="3 3"/><text x="345.7" y="116" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">30 questions</text><text x="714.0" y="340.8" font-size="12.5" font-weight="600" fill="#ffffff">300 questions</text><text x="714.0" y="358.8" font-size="12" fill="#94938b">6% reply</text><line x1="40" y1="438" x2="860" y2="438" stroke="#33322f" stroke-width="1"/><text x="40" y="462" font-size="12.5" fill="#c3c2b7">Illustrative. The shape is the point: past a certain length you stop measuring risk and start measuring patience.</text></svg>